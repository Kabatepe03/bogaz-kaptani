name: Android v30 ultra realism APK

on:
  workflow_dispatch:
  push:
    branches:
      - v30-ultra-realism

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GODOT_VERSION: 4.4.1
      GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /home/runner/.android/debug.keystore
      GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
      GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build V30 ultra-realism asset pack
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          pip install "numpy<3" "scipy>=1.14,<2" "trimesh>=4.4,<5" "pillow>=10,<12" "shapely>=2,<3" "mapbox-earcut>=1,<2" "networkx>=3,<4"
          python -m py_compile tools/generate_v30_world.py tools/generate_v30_vehicles.py tools/generate_v30_marine.py tools/fetch_v23_cc0_models.py

          python tools/generate_v11_assets.py
          python tools/generate_v15_assets.py
          python tools/generate_v20_assets.py
          python tools/generate_v20_ferry_ultra.py
          python tools/generate_v22_ferry.py
          python tools/generate_v23_ferry.py

          python tools/generate_v20_vehicles.py
          python tools/generate_v30_vehicles.py
          python tools/generate_v20_marine_assets.py
          python tools/generate_v30_marine.py

          python tools/generate_v20_world.py
          python tools/generate_v20_world_ultra.py
          python tools/generate_v22_world_finish.py
          python tools/generate_v23_world_visuals.py

          rm -f assets/v30/BUILD_METRICS.json
          for attempt in 1 2 3; do
            echo "V30 OSM detail attempt $attempt"
            python tools/generate_v30_world.py || true
            if test -s assets/v30/BUILD_METRICS.json; then
              break
            fi
            sleep 8
          done
          test -s assets/v30/BUILD_METRICS.json
          test -s assets/v30/foliage_points.json

          cp assets/v20/canakkale_eceabat_remaster_v20.glb assets/v12/canakkale_real_world_v12.glb
          python tools/fetch_v20_cc0_assets.py
          python tools/fetch_v23_cc0_models.py

          python - <<'PY'
          import json
          import trimesh
          from pathlib import Path

          with open('assets/v23/vegetation/MANIFEST.json', encoding='utf-8') as f:
              manifest = json.load(f)
          assert len(manifest.get('models', {})) >= 1, manifest
          assert 'pine_tree_01' not in manifest.get('models', {}), manifest

          with open('assets/v30/BUILD_METRICS.json', encoding='utf-8') as f:
              metrics = json.load(f)
          assert metrics.get('osm_elements', 0) > 1000, metrics
          assert metrics.get('windows', 0) > 500, metrics
          assert metrics.get('road_segments', 0) > 100, metrics

          ferry = trimesh.load('assets/v20/ferry_remaster_v20.glb', force='scene', process=False)
          nodes = set(ferry.graph.nodes)
          assert 'V23_RampFrontVisual' in nodes, sorted(nodes)[:30]
          assert 'V23_RampRearVisual' in nodes, sorted(nodes)[:30]

          print('V30 metrics:', metrics)
          print('CC0 vegetation models:', manifest.get('models', {}))
          print('V30 hinged ramps verified')
          PY

          test -s assets/v20/ferry_remaster_v20.glb
          test -s assets/v20/vehicles/sedan_remaster_v20.glb
          test -s assets/v20/vehicles/minibus_remaster_v20.glb
          test -s assets/v20/vehicles/bus_remaster_v20.glb
          test -s assets/v20/vehicles/truck_remaster_v20.glb
          test -s assets/v20/marine/cargo_ship_v20.glb
          test -s assets/v20/marine/tanker_v20.glb
          test -s assets/v20/marine/tug_v20.glb
          test -s assets/v20/marine/fishing_boat_v20.glb
          test -s assets/v20/canakkale_eceabat_remaster_v20.glb
          test -s assets/v20/materials/asphalt_diff.png
          test -s assets/v20/materials/concrete_diff.png
          test -s assets/v20/materials/ramp_metal_diff.png
          test -s assets/v20/terrain/dry_grass_diff.png
          test -s assets/v20/terrain/dirt_diff.png
          test -s assets/v20/terrain/rock_diff.png
          test -s assets/v23/vegetation/MANIFEST.json
          test -s assets/v12/canakkale_real_world_v12.glb
          find assets/v20 assets/v23 assets/v30 -maxdepth 4 -type f -printf '%p %k KB\n' | sort

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "build-tools;35.0.1" "platforms;android-35"

      - name: Create ephemeral debug keystore
        run: |
          mkdir -p "$HOME/.android"
          rm -f "$GODOT_ANDROID_KEYSTORE_DEBUG_PATH"
          keytool -genkeypair -v \
            -keystore "$GODOT_ANDROID_KEYSTORE_DEBUG_PATH" \
            -storepass "$GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD" \
            -alias "$GODOT_ANDROID_KEYSTORE_DEBUG_USER" \
            -keypass "$GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Boğaz Kaptanı V30 Ultra Realism Debug,O=Kabatepe03,C=TR"

      - name: Configure Godot Android paths
        run: |
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.4.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

      - name: Install Godot and export templates
        run: |
          set -eux
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          unzip -q Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          sudo mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          unzip -q Godot_v${GODOT_VERSION}-stable_export_templates.tpz -d /tmp/godot-templates
          cp -r /tmp/godot-templates/templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/

      - name: Verify Android toolchain
        run: |
          test -x "$ANDROID_HOME/platform-tools/adb"
          test -f "$GODOT_ANDROID_KEYSTORE_DEBUG_PATH"
          java -version
          "$ANDROID_HOME/platform-tools/adb" version

      - name: Import project and verify scripts and shaders
        run: |
          set -o pipefail
          godot --headless --editor --path . --quit 2>&1 | tee /tmp/godot-import.log
          if grep -E "SCRIPT ERROR: Parse Error|Failed to load script|Shader compilation failed|ERROR:.*shader" /tmp/godot-import.log; then
            echo "Godot V30 validation failed."
            exit 1
          fi

      - name: Export V30 APK
        run: |
          set -o pipefail
          mkdir -p build
          godot --headless --verbose --path . --export-debug Android build/BogazKaptani-v30-ultra-realism.apk 2>&1 | tee /tmp/godot-export.log
          if grep -E "SCRIPT ERROR: Parse Error|Failed to load script|Shader compilation failed" /tmp/godot-export.log; then
            echo "Godot V30 export contained script/shader errors."
            exit 1
          fi
          test -s build/BogazKaptani-v30-ultra-realism.apk
          ls -lh build/BogazKaptani-v30-ultra-realism.apk
          sha256sum build/BogazKaptani-v30-ultra-realism.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BogazKaptani-v30-ultra-realism-apk
          path: build/BogazKaptani-v30-ultra-realism.apk
          if-no-files-found: error