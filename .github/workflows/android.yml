name: Android v20 remaster APK

on:
  workflow_dispatch:
  push:
    branches: [ "v20-remaster" ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GODOT_VERSION: 4.4.1
      GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /home/runner/.android/debug.keystore
      GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
      GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build v20 remaster asset pack
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          pip install "numpy<3" "scipy>=1.14,<2" "trimesh>=4.4,<5" "pillow>=10,<12" "shapely>=2,<3" "mapbox-earcut>=1,<2" "networkx>=3,<4"
          python tools/generate_v11_assets.py
          python tools/generate_v14_world.py
          python tools/generate_v15_assets.py
          python tools/generate_v20_assets.py
          python tools/generate_v20_vehicles.py
          python tools/fetch_v20_cc0_assets.py
          test -s assets/v20/ferry_remaster_v20.glb
          test -s assets/v20/vehicles/sedan_remaster_v20.glb
          test -s assets/v20/vehicles/minibus_remaster_v20.glb
          test -s assets/v20/vehicles/bus_remaster_v20.glb
          test -s assets/v20/vehicles/truck_remaster_v20.glb
          test -s assets/v20/materials/asphalt_diff.png
          test -s assets/v20/materials/concrete_diff.png
          test -s assets/v20/materials/ramp_metal_diff.png
          test -s assets/v20/lighting/harbour_day_2k.hdr
          test -s assets/v12/canakkale_real_world_v12.glb
          find assets/v20 -maxdepth 3 -type f -printf '%p %k KB\n' | sort

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "build-tools;35.0.1" "platforms;android-35"

      - name: Create ephemeral debug keystore
        run: |
          mkdir -p "$HOME/.android"
          rm -f "$GODOT_ANDROID_KEYSTORE_DEBUG_PATH"
          keytool -genkeypair -v \
            -keystore "$GODOT_ANDROID_KEYSTORE_DEBUG_PATH" \
            -storepass "$GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD" \
            -alias "$GODOT_ANDROID_KEYSTORE_DEBUG_USER" \
            -keypass "$GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Boğaz Kaptanı v20 Remaster Debug,O=Kabatepe03,C=TR"

      - name: Configure Godot Android paths
        run: |
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.4.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

      - name: Install Godot and export templates
        run: |
          set -eux
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          unzip -q Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          sudo mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          unzip -q Godot_v${GODOT_VERSION}-stable_export_templates.tpz -d /tmp/godot-templates
          cp -r /tmp/godot-templates/templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/

      - name: Verify Android toolchain
        run: |
          test -x "$ANDROID_HOME/platform-tools/adb"
          test -f "$GODOT_ANDROID_KEYSTORE_DEBUG_PATH"
          java -version
          "$ANDROID_HOME/platform-tools/adb" version

      - name: Import project and verify scripts and shaders
        run: |
          set -o pipefail
          godot --headless --editor --path . --quit 2>&1 | tee /tmp/godot-import.log
          if grep -E "SCRIPT ERROR: Parse Error|Failed to load script|Shader compilation failed|ERROR:.*shader" /tmp/godot-import.log; then
            echo "Godot remaster validation failed."
            exit 1
          fi

      - name: Export v20 APK
        run: |
          set -o pipefail
          mkdir -p build
          godot --headless --verbose --path . --export-debug Android build/BogazKaptani-v20-remaster.apk 2>&1 | tee /tmp/godot-export.log
          if grep -E "SCRIPT ERROR: Parse Error|Failed to load script|Shader compilation failed" /tmp/godot-export.log; then
            echo "Godot export contained script/shader errors."
            exit 1
          fi
          test -s build/BogazKaptani-v20-remaster.apk
          ls -lh build/BogazKaptani-v20-remaster.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BogazKaptani-v20-remaster-apk
          path: build/BogazKaptani-v20-remaster.apk
          if-no-files-found: error
